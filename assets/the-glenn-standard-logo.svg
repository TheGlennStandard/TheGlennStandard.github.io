<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><title>The Glenn Standard — original arm cuts and V stitches</title><desc>Baseball-comma mark with the original artistic arm cutouts restored and V-shaped stitches retained. Four stitches on the left and five on the right follow the mirrored seam directions; the fifth right stitch remains at the midpoint. DG initials and the negative-space double-plate barbell are unchanged. Midnight #0F1D2B, Bone #F6F2EA and Stitch Red #BE3E2B.</desc><rect width="1024" height="1024" fill="#0F1D2B"/><defs><mask id="tail-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="white"/><g fill="black"><path d="M597 567 C631 579 679 574 711 540 C701 567 674 577 667 600 C664 638 654 675 636 713 C633 684 616 662 589 649 C548 622 495 642 451 666 C492 604 562 611 627 642 C636 615 641 597 635 588 C619 574 597 567 Z"/><path d="M335 857 C435 759 512 711 577 713 C494 733 412 801 335 857 Z"/></g></mask></defs><path d="M783 406 C826 646 636 817 286 898 C397 766 491 657 489 528 C588 576 731 539 783 406 Z" fill="#BE3E2B" mask="url(#tail-cut)"/><circle cx="593" cy="359" r="198" fill="#F6F2EA"/><g fill="none" stroke="#BE3E2B" stroke-width="7.5" stroke-linecap="round"><path d="M479 206 C424 281 424 437 479 512"/><path d="M707 206 C762 281 762 437 707 512"/></g><g fill="none" stroke="#BE3E2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M440.782 260.142 L448.572 272.803 L461.917 266.252 M432.674 293.211 L441.824 304.928 L454.357 296.933 M430.983 414.933 L443.516 422.928 L452.666 411.211 M438.005 448.252 L451.349 454.803 L459.140 442.142"/><path d="M745.218 260.142 L737.428 272.803 L724.083 266.252 M753.326 293.211 L744.176 304.928 L731.643 296.933 M759.250 354.000 L748.250 364.000 L737.250 354.000 M755.017 414.933 L742.484 422.928 L733.334 411.211 M747.995 448.252 L734.651 454.803 L726.860 442.142"/></g><g transform="translate(585 359) scale(.82) translate(-593 -349)"><defs><mask id="barbell-cut" maskUnits="userSpaceOnUse" x="400" y="180" width="380" height="360"><rect x="400" y="180" width="380" height="360" fill="white"/><g fill="black"><rect x="480" y="344" width="226" height="10" rx="5"/><rect x="515" y="322" width="26" height="54" rx="6"/><rect x="645" y="322" width="26" height="54" rx="6"/><rect x="495" y="330" width="16" height="38" rx="5"/><rect x="675" y="330" width="16" height="38" rx="5"/></g></mask></defs><g mask="url(#barbell-cut)"><g fill="#0F1D2B"><circle cx="521" cy="349" r="55"/><circle cx="665" cy="349" r="55"/><rect x="550" y="332" width="86" height="34" rx="10"/></g><g fill="none" stroke="#0F1D2B" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path d="M559 349 V258 C559 238 547 227 527 227"/><path d="M703 349 V440 C703 460 691 471 671 471"/></g></g></g></svg>